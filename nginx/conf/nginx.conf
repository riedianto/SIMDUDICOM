
# Konfigurasi Nginx untuk Sistem Antrian
# Letakkan file ini di folder nginx/conf/nginx.conf

worker_processes  auto;

events {
    worker_connections  2048;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # TCP/IP Optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Gzip Compression (Mengurangi ukuran file transfer hingga 70-80%)
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Optimalisasi untuk file besar (Video)
    client_max_body_size 500M;

    upstream backend_server {
        server 127.0.0.1:8055;
    }

    upstream frontend_server {
        server 127.0.0.1:3000;
    }
    
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       2026;
        server_name  localhost;

        # 1. Dashboard & Admin (Frontend Vanilla HTML/JS)
        # Nginx langsung melayani file statis dari folder frontend (TIDAK PERLU BUILD)
        location / {
            root "../frontend";
            index index.html login.html;
            try_files $uri $uri/ $uri.html /index.html;
        }

        # Cache & Optimasi static assets (CSS, JS, Images, Fonts) agar load instan di HP
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
            root "../frontend";
            expires 7d;
            access_log off;
            add_header Cache-Control "public, no-transform";
        }

        # 2. API Endpoints (Backend FastAPI)
        # Meneruskan semua route /api ke backend tanpa mengubah path (karena backend menggunakan prefix /api)
        location /api/ {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. WebSocket (Untuk Update Realtime)
        location /ws {
            proxy_pass http://backend_server/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
            proxy_read_timeout 86400;
        }

        # 4. STATIC FILES - OPTIMASI VIDEO & AUDIO (Nembak Langsung)
        # Nginx langsung ambil file dari folder tanpa lewat Python
        
        # Optimasi folder uploads (Video & Logo dari Admin)
        location ^~ /uploads/ {
            alias "../frontend/assets/uploads/";
            autoindex on;
            access_log off;
            expires 30d;
            add_header Accept-Ranges bytes;
        }

        # Optimasi folder wav (Suara Panggilan)
        location ^~ /wav/ {
            alias "../wav/";
            access_log off;
            expires 30d;
        }

        # Optimasi khusus folder VIDEO (Hanya untuk file video asli)
        # Nginx ambil langsung kalau ada ekstensi video, sisanya (hapus/api) lewat Python
        location ~* ^/video/.+\.(mp4|webm|ogg|m4v|mkv)$ {
            root "../";
            rewrite ^/video/(.*)$ /VIDEO/$1 break;
            access_log off;
            expires 30d;
            add_header Accept-Ranges bytes;
        }

        # Error page
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
