user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

# 1. HTTP/HTTPS Configuration (Web Dashboard & REST API)
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Optimalisasi untuk file besar
    client_max_body_size 500M;

    upstream backend_api {
        server backend-api:8000;
        keepalive 32;
    }

    # Resolver Docker internal agar nginx selalu resolve ulang DNS ketika container di-recreate
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        # Port kustom dashboard: 8026
        listen 8026;
        server_name localhost;

        # Web Dashboard Static Frontend
        location / {
            root /usr/share/nginx/html;
            index index.html login.html;
            try_files $uri $uri/ /index.html;
        }

        # Cache & Optimasi static assets
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
            root /usr/share/nginx/html;
            expires 7d;
            access_log off;
            add_header Cache-Control "public, no-transform";
        }

        # API Endpoints (Backend FastAPI)
        location /api/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # WebSocket support
        location /ws {
            proxy_pass http://backend_api/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
            proxy_read_timeout 86400;
        }
    }
}

# 2. TCP Stream Configuration (Untuk DICOM Services)
stream {
    # Resolve ulang hostname Docker saat container backend di-recreate
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxying DICOM Modality Worklist (C-FIND - Port 104)
    server {
        listen 104;
        set $mwl_backend mwl-scp:104;
        proxy_pass $mwl_backend;
        proxy_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Proxying DICOM C-STORE Receiver (Port 11112)
    server {
        listen 11112;
        set $dicom_backend dicom-receiver:11112;
        proxy_pass $dicom_backend;
        proxy_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # Proxying DICOM C-STORE Receiver (Port 4242)
    server {
        listen 4242;
        set $dicom_backend_4242 dicom-receiver:11112;
        proxy_pass $dicom_backend_4242;
        proxy_timeout 120s;
        proxy_connect_timeout 5s;
    }
}
